services:
  app:
    image: reysa96/php-laravel:8.2
    container_name: savings_app
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: savings_web
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: savings_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: savings
      MYSQL_USER: savings
      MYSQL_PASSWORD: savings
    ports:
      - "3307:3306"
    volumes:
      - savings_dbdata:/var/lib/mysql
  node:
    image: node:16
    working_dir: /var/www
    volumes:
      - .:/var/www
    command: npm install && npm run dev
    depends_on:
      - app
volumes:
  savings_dbdata:
